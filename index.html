<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RCM Pro Planner</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* 1. तिरंगा थीम */
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background: linear-gradient(180deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* 2. हेडर & लीडरबोर्ड */
        .header-section {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex-shrink: 0;
            border-bottom: 3px solid #000080;
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header-top h2 { margin: 0; color: #000080; font-size: 20px; text-transform: uppercase; }
        .report-btn { background: #FF9933; color: white; border: none; padding: 5px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; }

        /* Leaderboard Style */
        .leaderboard {
            background: #f0f8ff;
            border: 1px solid #000080;
            border-radius: 8px;
            padding: 8px;
            font-size: 13px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            color: #333;
        }
        .leader-item { text-align: center; }
        .leader-rank { font-weight: bold; color: #e68a00; font-size: 16px; }

        /* 3. कंट्रोल सेक्शन */
        .control-section {
            padding: 10px;
            text-align: center;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        
        .controls-row { display: flex; gap: 10px; width: 95%; max-width: 500px; justify-content: center; }
        
        .file-upload-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .btn-upload { border: 2px dashed #000080; color: #000080; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
        .file-upload-wrapper input[type=file] { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

        /* Filters */
        .filter-select, .month-select {
            padding: 10px;
            border: 2px solid #000080;
            border-radius: 20px;
            background: white;
            font-weight: bold;
            color: #000080;
            width: 48%;
        }
        input[type="text"]#searchInput { padding: 10px; width: 90%; border: 2px solid #000080; border-radius: 25px; text-align: center; outline: none; }

        /* 4. टेबल */
        .table-container {
            flex-grow: 1;
            overflow-y: auto;
            margin: 5px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
        thead th { background-color: #000080; color: white; padding: 10px 5px; text-align: left; position: sticky; top: 0; z-index: 10; font-size: 12px; }
        td { padding: 8px 5px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        /* Specific Columns */
        td:nth-child(1) { font-weight: 900; color: #333; font-size: 11px; } /* ID */
        
        /* Auto Target Buttons */
        .auto-btn {
            font-size: 9px;
            padding: 2px 4px;
            margin-top: 2px;
            background: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            display: inline-block;
        }
        .auto-btn:hover { background: #d0d0d0; }

        /* WhatsApp Icon */
        .wa-btn { text-decoration: none; font-size: 16px; margin-left: 5px; cursor: pointer; }

        .input-pv { width: 90%; padding: 5px; border: 1px solid #000080; border-radius: 4px; text-align: center; font-weight: bold; }
        .btn-save { background-color: #138808; color: white; border: none; padding: 6px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 12px; }
        
        .diff-val.positive { color: green; font-weight: bold; }
        .diff-val.negative { color: red; font-weight: bold; }

        /* Column Widths */
        th:nth-child(1), td:nth-child(1) { width: 12%; } /* ID */
        th:nth-child(2), td:nth-child(2) { width: 30%; } /* Name + WA */
        th:nth-child(3), td:nth-child(3) { width: 0%; display: none; } /* Mobile */
        th:nth-child(4), td:nth-child(4) { width: 14%; } /* PV */
        th:nth-child(5), td:nth-child(5) { width: 22%; } /* New */
        th:nth-child(6), td:nth-child(6) { width: 14%; } /* Save */
        th:nth-child(7), td:nth-child(7) { width: 8%; display: none; } /* Diff - mobile hide initially */

        @media screen and (min-width: 601px) {
            th:nth-child(3), td:nth-child(3) { display: table-cell; width: 15%; }
            th:nth-child(7), td:nth-child(7) { display: table-cell; width: 10%; }
        }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; text-align: center; border-top: 5px solid #FF9933; border-bottom: 5px solid #138808; max-height: 80vh; overflow-y: auto; }
        .chart-container { position: relative; height: 200px; width: 100%; margin-top: 10px; }
        .action-btn { width: 100%; padding: 10px; margin: 5px 0; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
        .btn-pdf { background: #dc3545; } .btn-excel { background: #28a745; } .btn-close { background: #6c757d; }
        .empty-msg { text-align: center; color: #666; padding: 30px; }

    </style>
</head>
<body>

    <div class="header-section">
        <div class="header-top">
            <h2>🇮🇳 RCM Pro</h2>
            <button class="report-btn" onclick="openReports()">📊 Reports</button>
        </div>
        
        <div class="leaderboard" id="leaderboard">
            <div class="leader-item">🥇 <span id="rank1">-</span></div>
            <div class="leader-item">🥈 <span id="rank2">-</span></div>
            <div class="leader-item">🥉 <span id="rank3">-</span></div>
        </div>
    </div>

    <div class="control-section">
        <div class="file-upload-wrapper">
            <button class="btn-upload">📂 Excel फाइल अपलोड करा</button>
            <input type="file" id="uploadExcel" accept=".xlsx, .xls" />
        </div>

        <div class="controls-row">
            <select id="filterSelect" class="filter-select" onchange="filterTable()">
                <option value="ALL">सर्व (All)</option>
                <option value="GROWTH">फक्त वाढ (Growth)</option>
                <option value="ZERO">Zero PV</option>
                <option value="TOP">Top 10</option>
            </select>
            
            <select id="monthSelect" class="month-select">
                <option>Jan 2025</option>
                <option>Feb 2025</option>
                <option>Mar 2025</option>
                <option>Apr 2025</option>
            </select>
        </div>

        <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="🔍 नाव किंवा ID शोधा...">
    </div>

    <div class="table-container">
        <table id="pvTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>नाव</th>
                    <th>मोबाईल</th>
                    <th>PV</th>
                    <th>New Target</th>
                    <th>Save</th>
                    <th>Diff</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7" class="empty-msg">👆 कृपया Excel फाइल अपलोड करा.</td></tr>
            </tbody>
        </table>
    </div>

    <div id="reportModal" class="modal">
        <div class="modal-content">
            <h3 style="color:#000080; margin-top:0;">🤖 Analysis & Charts</h3>
            
            <div id="aiText" style="text-align:left; font-size:14px; margin-bottom:10px;"></div>

            <div class="chart-container">
                <canvas id="growthChart"></canvas>
            </div>

            <button class="action-btn btn-pdf" onclick="generatePDF()">📄 PDF Download</button>
            <button class="action-btn btn-excel" onclick="generateExcel()">📊 Excel Download</button>
            <button class="action-btn btn-close" onclick="closeReports()">Close</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4rpjLDm8Q_L-xjvs1E_mV9KUBdwIGaeA",
            authDomain: "smartreport-7ce05.firebaseapp.com",
            projectId: "smartreport-7ce05",
            storageBucket: "smartreport-7ce05.firebasestorage.app",
            messagingSenderId: "679934692192",
            appId: "1:679934692192:web:a8bf0a52fdac79eebc2c05"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.associateData = [];
        let myChart = null;

        const tableBody = document.getElementById('tableBody');

        // Set Current Month
        const date = new Date();
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        document.getElementById('monthSelect').value = `${monthNames[date.getMonth()]} ${date.getFullYear()}`;

        // Excel Upload
        document.getElementById('uploadExcel').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(sheet);

                if (jsonData.length === 0) { alert("File Empty!"); return; }

                window.associateData = jsonData.map(row => ({
                    id: row['ID'] || row['IdNo'] || row['Id'] || 'N/A',
                    name: row['Name'] || row['Associate Name'] || 'Unknown',
                    mobile: row['Mobile'] || row['MobileNo'] || '',
                    pv: parseInt(row['PV'] || row['OctPv'] || row['Old PV'] || 0),
                    target: 0,
                    diff: 0
                }));
                loadTable();
                updateLeaderboard();
            };
            reader.readAsArrayBuffer(file);
        });

        function loadTable() {
            tableBody.innerHTML = '';
            if (window.associateData.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" class="empty-msg">👆 कृपया Excel फाइल अपलोड करा.</td></tr>';
                return;
            }

            window.associateData.forEach((row, index) => {
                let tr = document.createElement('tr');
                
                // 🟢 WhatsApp Link Generation
                let waLink = row.mobile ? `https://wa.me/91${row.mobile}?text=Namaskar ${row.name}, Your Old PV is ${row.pv}. Target for this month is ${row.target || 'Pending'}.` : '#';
                let waIcon = row.mobile ? `<a href="${waLink}" target="_blank" class="wa-btn">🟢</a>` : '';

                tr.innerHTML = `
                    <td>${row.id}</td>
                    <td>
                        ${row.name} ${waIcon}
                    </td>
                    <td class="mobile-col">${row.mobile}</td>
                    <td id="old-${index}">${row.pv}</td>
                    <td>
                        <input type="number" class="input-pv" id="input-${index}" placeholder="Target" oninput="window.calcDiff(${index})" value="${row.target || ''}">
                        <br>
                        <span class="auto-btn" onclick="window.setTarget(${index}, 1.1)">+10%</span>
                        <span class="auto-btn" onclick="window.setTarget(${index}, 1.2)">+20%</span>
                        <span class="auto-btn" onclick="window.setTarget(${index}, 1.5)">+50%</span>
                    </td>
                    <td><button class="btn-save" onclick="window.saveToFirebase(${index})">Save</button></td>
                    <td id="diff-${index}" class="diff-val">${row.diff > 0 ? '+' + row.diff : row.diff}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // ⚡ Auto-Target Logic
        window.setTarget = function(index, multiplier) {
            const oldPv = window.associateData[index].pv;
            let newTarget = Math.ceil(oldPv * multiplier);
            // If old PV is 0, give a base target like 500
            if (oldPv === 0) newTarget = 500;
            
            document.getElementById(`input-${index}`).value = newTarget;
            window.calcDiff(index);
        }

        // Calculate Difference
        window.calcDiff = function(index) {
            const newVal = document.getElementById(`input-${index}`).value;
            const newPv = newVal ? parseInt(newVal) : 0;
            const oldPv = window.associateData[index].pv;
            const diff = newPv - oldPv;
            
            // Update Data Array
            window.associateData[index].target = newPv;
            window.associateData[index].diff = diff;

            // Update UI
            const diffCell = document.getElementById(`diff-${index}`);
            diffCell.innerText = diff > 0 ? `+${diff}` : diff;
            diffCell.className = diff > 0 ? 'diff-val positive' : (diff < 0 ? 'diff-val negative' : 'diff-val');

            updateLeaderboard(); // Live Update Leaderboard
        }

        // 🏆 Leaderboard Logic
        function updateLeaderboard() {
            // Sort by Difference (Growth)
            const sorted = [...window.associateData].sort((a, b) => b.diff - a.diff);
            
            const top3 = sorted.slice(0, 3);
            if(top3[0]) document.getElementById('rank1').innerText = `${top3[0].name.split(' ')[0]} (+${top3[0].diff})`;
            if(top3[1]) document.getElementById('rank2').innerText = `${top3[1].name.split(' ')[0]} (+${top3[1].diff})`;
            if(top3[2]) document.getElementById('rank3').innerText = `${top3[2].name.split(' ')[0]} (+${top3[2].diff})`;
        }

        // 🎉 Save with Confetti & Month
        window.saveToFirebase = async function(index) {
            const rowData = window.associateData[index];
            const month = document.getElementById('monthSelect').value;
            
            if (!rowData.target) { alert("Target टाका!"); return; }

            const btn = document.querySelectorAll('.btn-save')[index];
            btn.innerText = "⏳";

            try {
                await setDoc(doc(db, "rcm_targets", rowData.id.toString()), {
                    name: rowData.name,
                    mobile: rowData.mobile,
                    old_pv: rowData.pv,
                    target: rowData.target,
                    diff: rowData.diff,
                    month: month,
                    updated_at: serverTimestamp()
                });
                
                // Success Animation
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });

                btn.innerText = "✅";
                setTimeout(() => { btn.innerText = "Save"; }, 2000);
            } catch (error) {
                console.error(error);
                btn.innerText = "❌";
            }
        }

        // 🔍 Smart Filters
        window.filterTable = function() {
            const search = document.getElementById('searchInput').value.toUpperCase();
            const type = document.getElementById('filterSelect').value;
            const tr = tableBody.getElementsByTagName('tr');

            window.associateData.forEach((row, i) => {
                let show = true;
                
                // Search Filter
                if (search && !row.name.toUpperCase().includes(search) && !row.id.toString().includes(search)) {
                    show = false;
                }

                // Dropdown Filter
                if (type === 'GROWTH' && row.diff <= 0) show = false;
                if (type === 'ZERO' && row.pv > 0) show = false;
                
                // Top 10 logic handles differently (sorting), simpler to just filter for now
                if (type === 'TOP') {
                    // Just show those with diff > 1000 for simplicity in this view
                    if(row.diff < 500) show = false;
                }

                if(tr[i]) tr[i].style.display = show ? "" : "none";
            });
        }

        // 📊 Charts & Reports
        window.openReports = function() {
            if(window.associateData.length === 0) { alert("Data Empty!"); return; }
            document.getElementById('reportModal').style.display = 'flex';
            
            let totalOld = 0, totalTarget = 0;
            window.associateData.forEach(d => { totalOld += d.pv; totalTarget += (d.target || d.pv); });
            const growth = totalTarget - totalOld;

            document.getElementById('aiText').innerHTML = `
                <strong>📈 Old Business:</strong> ${totalOld}<br>
                <strong>🎯 New Target:</strong> ${totalTarget}<br>
                <strong>🚀 Growth:</strong> <span style="color:green">+${growth}</span>
            `;

            // Chart.js
            const ctx = document.getElementById('growthChart').getContext('2d');
            if(myChart) myChart.destroy();
            
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Old Business', 'Growth'],
                    datasets: [{
                        data: [totalOld, growth > 0 ? growth : 0],
                        backgroundColor: ['#000080', '#138808']
                    }]
                }
            });
        }

        window.closeReports = function() { document.getElementById('reportModal').style.display = 'none'; }
        
        // Export Functions
        window.generatePDF = function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const data = window.associateData.filter(d => d.diff !== 0);
            const rows = data.map(i => [i.id, i.name, i.pv, i.target, i.diff]);
            doc.text(`RCM Target Report - ${document.getElementById('monthSelect').value}`, 14, 15);
            doc.autoTable({ head: [['ID', 'Name', 'Old', 'Target', 'Diff']], body: rows, startY: 20 });
            doc.save('RCM_Report.pdf');
        }

        window.generateExcel = function() {
            const ws = XLSX.utils.json_to_sheet(window.associateData.map(i => ({ID:i.id, Name:i.name, Old:i.pv, Target:i.target, Diff:i.diff})));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Targets");
            XLSX.writeFile(wb, "RCM_Targets.xlsx");
        }

    </script>
</body>
</html>
